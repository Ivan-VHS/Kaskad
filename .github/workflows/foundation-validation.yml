name: Foundation validation

on:
  push:
    branches:
      - main
      - "theory/**"
      - "research/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-foundation:
    name: Validate research foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check ecosystem synchronization script syntax
        run: node --check scripts/sync_vyunenko_docs.mjs

      - name: Validate mathematical and computational contracts
        run: node scripts/validate-foundation.mjs
