[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaskad-k3"
version = "0.1.0"
description = "Exact reference implementation of the Vyunenko K3 cascade system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [
  { name = "Ivan-VHS" }
]
keywords = ["K3", "positional-system", "radix-1000", "number-theory"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
