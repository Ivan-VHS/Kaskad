<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kaskad — Jade Atlas</title>
  <desc id="desc">Original abstract banner with obsidian ground, jade chain geometry, amber map lines and the K3 positional base 1000.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090D"/>
      <stop offset="0.58" stop-color="#090B0F"/>
      <stop offset="1" stop-color="#11151C"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="0.55" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A8A29E" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#ground)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="url(#grid)" stroke="#34D399" stroke-opacity=".45" stroke-width="2"/>
  <path d="M28 250H1172" stroke="#34D399" stroke-opacity=".24"/>
  <path d="M28 258H1172" stroke="#F59E0B" stroke-opacity=".14"/>

  <g transform="translate(92 158)" fill="none" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="54" ry="34" stroke="url(#jade)" stroke-width="4" transform="rotate(-32)"/>
    <ellipse cx="62" cy="0" rx="54" ry="34" stroke="url(#jade)" stroke-width="4" transform="rotate(32)"/>
    <circle cx="31" cy="0" r="7" fill="#FBBF24" stroke="none"/>
    <path d="M-48 0H-76M108 0H140" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(330 52)">
    <text x="0" y="24" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" letter-spacing="5">IVAN-VHS / KASKAD</text>
    <text x="0" y="92" fill="#F4F4F5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="46" font-weight="700" letter-spacing="2">ТЕОРИЯ ВЬЮНЕНКО</text>
    <text x="3" y="137" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="27" letter-spacing="4">K3 · POSITIONAL CASCADE</text>
    <path d="M0 164H650" stroke="url(#amber)" stroke-width="2"/>
    <text x="0" y="202" fill="#A8A29E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="2">B = 1000 = 10³ = 2³ · 5³</text>
  </g>

  <g transform="translate(1015 154)">
    <circle r="86" fill="none" stroke="#34D399" stroke-opacity=".24" stroke-width="1.5"/>
    <circle r="64" fill="none" stroke="#F59E0B" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle r="42" fill="#10B981" fill-opacity=".06" stroke="url(#jade)" stroke-width="2"/>
    <path d="M0-76V76M-76 0H76M-54-54L54 54M54-54L-54 54" stroke="#34D399" stroke-opacity=".28"/>
    <path d="M-22 0H22M0-22V22" stroke="#FBBF24" stroke-width="2"/>
    <circle r="5" fill="#FBBF24"/>
  </g>

  <text x="32" y="294" fill="#A8A29E" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="3">POSITION IS STRUCTURE · ZERO KEEPS ITS PLACE · PROOF SETS THE SEAL</text>
  <text x="1168" y="294" fill="#34D399" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">K3 / 1000</text>
</svg>