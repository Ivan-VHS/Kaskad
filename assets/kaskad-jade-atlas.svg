<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kaskad — нефритовый атлас Теории Вьюненко K3</title>
  <desc id="desc">Original abstract mathematical banner: jade rings, lacquer-red arcs, imperial-gold paths, ash and plum geometry over a dark graphite field. No character or franchise imagery.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10131A"/><stop offset=".52" stop-color="#20232C"/><stop offset="1" stop-color="#17151D"/></linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B0DEC0"/><stop offset=".55" stop-color="#4E9B79"/><stop offset="1" stop-color="#247A60"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8CA85"/><stop offset="1" stop-color="#B98239"/></linearGradient>
    <linearGradient id="lacquer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E16D70"/><stop offset="1" stop-color="#8D263B"/></linearGradient>
    <radialGradient id="mist"><stop offset="0" stop-color="#769194" stop-opacity=".22"/><stop offset="1" stop-color="#769194" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#DEBCA1" stroke-opacity=".075" stroke-width="1"/><circle cx="0" cy="0" r="1.2" fill="#D8AD58" fill-opacity=".18"/></pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#ground)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="url(#grid)" stroke="#8BC8A6" stroke-opacity=".32" stroke-width="1.5"/>
  <ellipse cx="110" cy="175" rx="230" ry="190" fill="url(#mist)"/><ellipse cx="1095" cy="170" rx="210" ry="190" fill="url(#mist)"/>
  <g transform="translate(126 166)" fill="none">
    <circle r="88" stroke="#63394F" stroke-width="2" stroke-dasharray="3 9"/><circle r="72" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="48 12 7 12"/>
    <circle r="54" stroke="url(#jade)" stroke-width="5"/><path d="M-40 0C-22-34 20-34 40 0C20 34-22 34-40 0Z" stroke="url(#jade)" stroke-width="3"/>
    <path d="M-65 0H-28M28 0H65M0-65V-28M0 28V65" stroke="#B83A45" stroke-width="2"/><circle r="8" fill="#D8AD58" stroke="none" filter="url(#softGlow)"/>
    <path d="M-108 105L-60 77L-22 94L20 70L65 90L110 60" stroke="#769194" stroke-width="1.5" opacity=".8"/>
    <path d="M-100-112L-58-82L-19-99L18-76L61-92L104-61" stroke="#B83A45" stroke-width="1.5" opacity=".72"/>
  </g>
  <g transform="translate(316 58)">
    <text x="0" y="24" fill="#8BC8A6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="5">IVAN-VHS / KASKAD</text>
    <text x="0" y="92" fill="#F0E8D7" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1">ТЕОРИЯ ВЬЮНЕНКО</text>
    <text x="3" y="137" fill="#D8AD58" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="25" letter-spacing="4">K3 · КАСКАДНО-1000</text>
    <path d="M0 161H630" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="199" fill="#DEBCA1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="1.8">B = 1000 = 10³ = 2³ · 5³</text>
    <text x="0" y="236" fill="#A9ADB4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">ПОЗИЦИЯ СОХРАНЯЕТ СТРУКТУРУ · ДОКАЗАТЕЛЬСТВО ЗАДАЁТ ГРАНИЦУ</text>
  </g>
  <g transform="translate(1055 174)">
    <circle r="91" fill="none" stroke="#63394F" stroke-width="2" stroke-dasharray="5 8"/><circle r="74" fill="none" stroke="url(#lacquer)" stroke-width="2"/>
    <circle r="56" fill="#247A60" fill-opacity=".10" stroke="url(#jade)" stroke-width="2.5"/>
    <path d="M0-76V76M-76 0H76M-54-54L54 54M54-54L-54 54" stroke="#A9ADB4" stroke-opacity=".25"/>
    <path d="M-29 15L-10-17L0 3L13-32L29 15" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="5" fill="#D8AD58"/><path d="M-108 108C-55 84 20 90 95 114" fill="none" stroke="#769194" stroke-width="1.5"/>
  </g>
  <path d="M28 290H1172" stroke="#8BC8A6" stroke-opacity=".22"/><path d="M28 298H1172" stroke="#B83A45" stroke-opacity=".25"/>
  <text x="32" y="333" fill="#A9ADB4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2.2">JADE / LACQUER / ASH / GOLD · MATHEMATICS BEFORE ORNAMENT</text>
  <text x="1168" y="333" fill="#D8AD58" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">K3 · B=1000</text>
</svg>